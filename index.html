<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nil Viola - Oficial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background-color: #07070a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
        }
        .painel {
            text-align: center;
            background: #14141c;
            padding: 40px 30px;
            border-radius: 24px;
            border: 2px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px; 
            width: 100%;
        }
        .foto-perfil {
            width: 130px; 
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.8rem; color: #ffffff; margin-bottom: 8px; }
        .estilo { color: #d4af37; font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 30px; font-weight: bold; }
        
        .bloco-botoes {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
        }
        .botao-musica {
            flex: 1;
            display: block;
            padding: 20px 10px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .cor-verde { background-color: #1DB954; color: #000000; }
        .cor-vermelha { background-color: #FF0000; color: #ffffff; }
    </style>
</head>
<body>
    <div class="painel">
        <!-- Foto de uma viola caipira iluminada no estúdio -->
        <img class="foto-perfil" src="https://unsplash.com" alt="Nil Viola">
        
        <h1>Nil Viola</h1>
        <div class="estilo">SERTANEJO GOSPEL</div>
        
        <div class="bloco-botoes">
            <!-- Link Oficial do seu Perfil de Artista no Spotify -->
            <a href="https://spotify.com" target="_blank" class="botao-musica cor-verde">
                Spotify
            </a>
            <!-- Link Oficial do seu Perfil de Artista no YouTube Music -->
            <a href="https://youtube.com" target="_blank" class="botao-musica cor-vermelha">
                YouTube
            </a>
        </div>
    </div>
</body>
</html>

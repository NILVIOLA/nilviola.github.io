            justify-content: center;
            gap: 12px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 17px 40px;
            margin: 11px 0;
            border-radius: 12px;
            color: #fff;
            width: 270px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.35);
            transition: transform 0.25s ease;
        }
        a:hover { transform: translateY(-3px); }
        /* Cores oficiais */
        .spotify  { background: #1DB954; color: #000; }

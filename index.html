<!DOCTYPE html>
 <html lang="pt-BR">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Nil Viola - Links Oficiais</title>
     <style>
         * {
             margin: 0;
             padding: 0;
             box-sizing: border-box;
         }
         body {
             /* Imagem de fundo: Sertão/Árvore/Entardecer - visual profissional e rústico */
             background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)), 
                         url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80') center/cover no-repeat fixed;
             min-height: 100vh;
             display: flex;
             flex-direction: column;
             justify-content: center;
             align-items: center;
             font-family: 'Arial', sans-serif;
         }
         /* Apenas os botões/links */
         a {
             text-decoration: none;
             font-size: 1.25rem;
             font-weight: bold;
             padding: 18px 40px;
             margin: 12px 0;
             border-radius: 12px;
             color: #fff;
             transition: transform 0.2s ease;
         }
         a:hover {
             transform: scale(1.05);
         }
         .spotify {
             background-color: #1DB954;
         }
         .youtube {
             background-color: #FF0000;
         }
     </style>
 </head>
 <body>
     <a href="https://open.spotify.com/intl-pt/artist/6yylUfu6eFugErm8OE9vh7" target="_blank" class="spotify">🎵 Ouvir no Spotify</a>
     <a href="https://music.youtube.com/channel/UCPpBU0oGU5tQWkRxGYvsWyA" target="_blank" class="youtube">🎧 Ouvir no YouTube Music</a>
 </body>
 </html>

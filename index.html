<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nil Viola - Oficial</title>
    <style>
        /* Força o site a ocupar 100% da tela do celular sem cortar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background-color: #0b0b12;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, sans-serif;
        }

        /* Foto de uma linda viola caipira em alta definição cobrindo todo o fundo do site */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(11, 11, 18, 0.85), rgba(11, 11, 18, 0.95)), url('https://unsplash.com');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        /* Painel centralizado que flutua elegantemente na tela */
        .painel-artista {
            text-align: center;
            background: rgba(22, 22, 32, 0.75);
            padding: 45px 30px;
            border-radius: 28px;
            border: 2px solid #d4af37;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            width: 88%;
            max-width: 380px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* Ícone circular dourado decorativo */
        .foto-perfil {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            border: 3px solid #d4af37;
            background-color: #161620;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .estilo-musical {
            font-size: 0.85rem;
            color: #d4af37;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
        }

        /* Botões verticais grandes e fáceis de clicar no celular */
        .bloco-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .botao-plataforma {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Cores vibrantes e oficiais */
        .cor-spotify {
            background-color: #1DB954;
            color: #000000;
            box-shadow: 0 4px 20px rgba(29, 185, 84, 0.4);
        }

        .cor-youtube {
            background-color: #FF0000;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
        }

        .icone-emoji {
            margin-right: 12px;
            font-size: 1.3rem;
        }
    </style>
</head>

        <div class="foto-perfil">🎸</div>
        
        <h1>Nil Viola</h1>
        <div class="estilo-musical">Sertanejo Gospel</div>

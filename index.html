<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nil Viola - Oficial</title>
</head>
<body style="margin: 0; padding: 0; background: #0b0b12 linear-gradient(rgba(11,11,18,0.85), rgba(11,11,18,0.95)), url('https://unsplash.com') no-repeat center center fixed; background-size: cover; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100vw;">

    <div style="text-align: center; background: rgba(22, 22, 32, 0.85); padding: 40px 25px; border-radius: 24px; border: 2px solid #d4af37; box-shadow: 0 20px 40px rgba(0,0,0,0.7); width: 85%; max-width: 360px;">
        
        <!-- Ícone da Viola Dourada -->
        <div style="width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px auto; border: 3px solid #d4af37; background: #161620; display: flex; justify-content: center; align-items: center; font-size: 3rem; box-shadow: 0 0 20px rgba(212,175,55,0.4);">🎸</div>
        
        <h1 style="font-size: 1.8rem; margin: 0 0 5px 0; font-weight: bold; color: #fff;">Nil Viola</h1>
        <div style="color: #d4af37; font-size: 0.85rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;">Sertanejo Gospel</div>
        
        <!-- Bloco de Links Oficiais -->
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
            
            <!-- Link Oficial do Perfil do Nil Viola no Spotify -->
            <a href="https://spotify.com" target="_blank" style="display: flex; align-items: center; justify-content: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem; background-color: #1DB954; color: #000000; box-shadow: 0 4px 15px rgba(29,185,84,0.4);">
                <span style="margin-right: 10px; font-size: 1.3rem;">🎵</span> Ouvir no Spotify
            </a>

            <!-- Link Oficial do Canal do Nil Viola no YouTube -->
            <a href="https://youtube.com" target="_blank" style="display: flex; align-items: center; justify-content: center; padding: 15px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1.1rem; background-color: #FF0000; color: #ffffff; box-shadow: 0 4px 15px rgba(255,0,0,0.4);">
                <span style="margin-right: 10px; font-size: 1.3rem;">🎧</span> Ouvir no YouTube
            </a>
            
        </div>
    </div>

</body>
</html>

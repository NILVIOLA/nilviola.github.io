<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nil Viola - Oficial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: #0a0a0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .bg-glow {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: 15%; left: 50%; transform: translateX(-50%); filter: blur(60px); z-index: 1;
        }
        .container {
            text-align: center;
            z-index: 2;
            background: rgba(20, 20, 28, 0.6);
            padding: 35px 25px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 400px; width: 90%;
        }
        .artist-img {
            width: 130px; height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
        }
        h1 { font-size: 1.8rem; letter-spacing: 1px; color: #fff; margin-bottom: 5px; font-weight: 700; }
        .genre { color: #d4af37; font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px; }
        
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 22px 10px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .spotify { background: rgba(29, 185, 84, 0.1); border-color: rgba(29, 185, 84, 0.2); }
        .spotify:hover { background: #1DB954; box-shadow: 0 0 15px rgba(29, 185, 84, 0.5); color: #000; }
        
        .youtube { background: rgba(255, 0, 0, 0.08); border-color: rgba(255, 0, 0, 0.2); }
        .youtube:hover { background: #FF0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        
        .btn-link .icon { font-size: 1.5rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <img class="artist-img" src="https://unsplash.com" alt="Nil Viola">
        
        <h1>Nil Viola</h1>
        <div class="genre">Sertanejo Gospel</div>
        
        <div class="links-grid">
            <a href="https://spotify.com" target="_blank" class="btn-link spotify">
                <span class="icon">🎵</span>
                <span>Spotify</span>
            </a>
            <a href="https://youtube.com" target="_blank" class="btn-link youtube">
                <span class="icon">🎧</span>
                <span>YouTube Music</span>
            </a>
        </div>
    </div>
</body>
</html>

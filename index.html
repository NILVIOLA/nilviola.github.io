<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nil Viola - Oficial</title>
</head>
<body style="margin: 0; padding: 0; min-height: 100vh; width: 100vw; background: #0b0b12 linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.85)), url('https://unsplash.com') no-repeat center center fixed; background-size: cover; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center;">

    <div style="text-align: center; background: rgba(18, 14, 10, 0.88); padding: 45px 25px; border-radius: 28px; border: 3px solid #d4af37; box-shadow: 0 20px 50px rgba(0,0,0,0.9); width: 88%; max-width: 370px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
        
        <!-- Ícone da Viola Caipira Iluminada -->
        <div style="width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 20px auto; border: 3px solid #d4af37; background: #261c14; display: flex; justify-content: center; align-items: center; font-size: 3.5rem; box-shadow: 0 0 25px rgba(212,175,55,0.6);">🎸</div>
        
        <h1 style="font-size: 2.1rem; margin: 0 0 6px 0; font-weight: bold; color: #ffffff; letter-spacing: 1px;">Nil Viola</h1>
        <div style="color: #d4af37; font-size: 0.9rem; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 35px;">Sertanejo Gospel</div>
        
        <!-- Links Reais Oficiais do Artista -->
        <div style="display: flex; flex-direction: column; gap: 18px; width: 100%;">
            
            <!-- Link do Spotify Oficial do Nil Viola -->
            <a href="https://spotify.com" target="_blank" style="display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: bold; font-size: 1.1rem; background-color: #1DB954; color: #000000; box-shadow: 0 5px 20px rgba(29,185,84,0.4);">
                <span style="margin-right: 12px; font-size: 1.4rem;">🎵</span> Ouvir no Spotify
            </a>

            <!-- Link do YouTube Music Oficial do Nil Viola -->
            <a href="https://youtube.com" target="_blank" style="display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 14px; text-decoration: none; font-weight: bold; font-size: 1.1rem; background-color: #FF0000; color: #ffffff; box-shadow: 0 5px 20px rgba(255,0,0,0.4);">
                <span style="margin-right: 12px; font-size: 1.4rem;">🎧</span> YouTube Music
            </a>
            
        </div>
    </div>

</body>
</html>
